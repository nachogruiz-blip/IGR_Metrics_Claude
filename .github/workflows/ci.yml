name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest

  dashboard:
    name: Tests del dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r dashboard/requirements.txt
      - run: pytest dashboard/tests
      - name: La app arranca en modo demo
        run: |
          STOCKDASH_DEMO=1 timeout 60 python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('dashboard/app.py', default_timeout=60).run(); assert not at.exception, at.exception"

  commodities:
    name: Tests del dashboard de commodities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r commodities/requirements.txt
      - run: pytest commodities/tests
      - name: La app arranca en modo demo
        run: |
          COMMODASH_DEMO=1 timeout 90 python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('commodities/app.py', default_timeout=60).run(); assert not at.exception, at.exception"

  analisis_empresa:
    name: Tests del analizador de empresas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analisis_empresa/requirements.txt
      - run: pytest analisis_empresa/tests
      - name: La app arranca en modo demo
        run: |
          ANALYST_DEMO=1 timeout 90 python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('analisis_empresa/app.py', default_timeout=60).run(); assert not at.exception and len(at.title) == 1, at.exception"

  estudio_video:
    name: Tests del estudio de vídeo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r estudio_video/requirements.txt
      - run: pytest estudio_video/tests

  comparador_precios:
    name: Tests del comparador de precios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r comparador_precios/requirements.txt
      - run: pytest comparador_precios/tests
      - name: La app arranca en modo demo
        run: |
          PRICECHECK_DEMO=1 timeout 90 python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('comparador_precios/app.py', default_timeout=60).run(); assert not at.exception and len(at.title) == 1, at.exception"

  latex:
    name: Compilar LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-recommended \
            texlive-latex-extra texlive-lang-spanish texlive-bibtex-extra texlive-pictures \
            biber latexmk lmodern
      - name: Documento compañero
        run: cd latex && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Guía teórica
        run: cd latex/guia && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Sin referencias rotas
        run: |
          ! grep -E "LaTeX Warning: (Reference|Citation).*undefined" latex/main.log latex/guia/main.log
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            latex/main.pdf
            latex/guia/main.pdf
